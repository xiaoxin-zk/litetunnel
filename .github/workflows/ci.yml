name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  #  控制面：静态检查 + 编译 + 启动冒烟测试
  # ============================================================
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Resolve dependencies
        working-directory: server
        run: go mod tidy

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Build
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X github.com/xiaoxin-zk/litetunnel/server/internal/config.Version=ci-${GITHUB_SHA::7}" \
            -o /tmp/panel ./cmd/panel

      # 编译通过不代表能启动：数据库 DSN、迁移语句、路由注册等问题
      # 只有真正跑起来才会暴露，这一步把部署风险前移到 CI。
      - name: Smoke test
        working-directory: server
        env:
          LT_ENV: development
          LT_LOG_LEVEL: info
          LT_DB_DRIVER: sqlite
          LT_DB_DSN: /tmp/smoke/litetunnel.db
          LT_USER_ADDR: 127.0.0.1:7848
          LT_GATEWAY_HOST: 127.0.0.1
          LT_GATEWAY_PORT: "7001"
          LT_FRPS_API_ADDR: 127.0.0.1:7500
          LT_CLIENT_DIST_DIR: /tmp/smoke/clients
          # 用非默认值验证管理后台路径可配置
          LT_ADMIN_PATH: /smoke-console
          LT_USER_WEB_DIR: /tmp/smoke/userweb
          LT_ADMIN_WEB_DIR: /tmp/smoke/adminweb
          # 固定管理员口令：冒烟测试要用管理员身份验证管理接口（生成兑换码等）
          LT_BOOTSTRAP_ADMIN_USER: smokeadmin
          LT_BOOTSTRAP_ADMIN_PASSWORD: SmokeAdminPass123
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:7848
          # 最小前端产物，用于验证两套 SPA 的挂载与路径隔离
          mkdir -p /tmp/smoke/userweb/assets /tmp/smoke/adminweb/assets
          printf '<html>USER-CONSOLE</html>' > /tmp/smoke/userweb/index.html
          printf '<html>ADMIN-CONSOLE</html>' > /tmp/smoke/adminweb/index.html
          /tmp/panel > /tmp/smoke/panel.log 2>&1 &
          PANEL_PID=$!
          trap 'kill $PANEL_PID 2>/dev/null || true' EXIT

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "$BASE/healthz" > /dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 $PANEL_PID 2>/dev/null; then
              echo "::error::panel exited during startup"; cat /tmp/smoke/panel.log; exit 1
            fi
            sleep 1
          done
          [ "$ok" = "1" ] || { echo "::error::panel did not become healthy"; cat /tmp/smoke/panel.log; exit 1; }
          echo "PASS healthz"

          # 版本号必须能从 /healthz 读到，部署后才好确认线上跑的是哪个版本
          ver=$(curl -fsS "$BASE/healthz" | grep -o '"version":"[^"]*"' || true)
          if ! printf '%s' "$ver" | grep -q 'ci-'; then
            echo "::error::version not injected into the binary (got '$ver')"
            exit 1
          fi
          echo "PASS build version injected ($ver)"

          # 统一登录入口：账号密码错误应返回 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"username":"x","password":"y"}' \
            "$BASE/api/auth/login")
          if [ "$code" != "401" ]; then
            echo "::error::unified login returned $code, want 401"
            exit 1
          fi
          echo "PASS unified login endpoint"

          # 旧的独立登录入口必须已下线，避免留下第二条可爆破路径
          for old in /api/user/auth/login /api/admin/auth/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -d '{"username":"x","password":"y"}' \
              "$BASE$old")
            if [ "$code" != "404" ]; then
              echo "::error::$old still reachable (got $code), want 404"
              exit 1
            fi
          done
          echo "PASS legacy login endpoints removed"

          # 公共站点信息：登录前就要能读到
          body=$(curl -fsS "$BASE/api/public/settings")
          if ! printf '%s' "$body" | grep -q 'register_enabled'; then
            echo "::error::public settings endpoint missing expected fields"
            exit 1
          fi
          # 公共接口绝不能泄露密钥类字段
          if printf '%s' "$body" | grep -qiE 'password|secret|smtp\.'; then
            echo "::error::public settings leaked sensitive fields"
            exit 1
          fi
          echo "PASS public settings (no sensitive fields)"

          # ===== 长期凭据认证链路 =====
          # 这段是回归测试：曾经因为「凭据路径传版本号 0、而账号版本号默认 1」
          # 导致 API Key 与客户端凭据认证一律 401，整套客户端不可用。
          # 冒烟测试当时只覆盖了 JWT 路径，没能拦住，所以这里把完整链路补上。

          # 1) 取验证码并解出答案（算术题：a + b 或 a - b）
          cap=$(curl -fsS "$BASE/api/public/captcha")
          ticket=$(printf '%s' "$cap" | sed -n 's/.*"ticket":"\([^"]*\)".*/\1/p')
          question=$(printf '%s' "$cap" | sed -n 's/.*"question":"\([^"]*\)".*/\1/p')
          if [ -z "$ticket" ] || [ -z "$question" ]; then
            echo "::error::captcha endpoint did not return ticket/question"
            exit 1
          fi
          ca=$(printf '%s' "$question" | awk '{print $1}')
          cop=$(printf '%s' "$question" | awk '{print $2}')
          cb=$(printf '%s' "$question" | awk '{print $3}')
          if [ "$cop" = "+" ]; then canswer=$((ca + cb)); else canswer=$((ca - cb)); fi
          echo "PASS captcha issued ($question -> $canswer)"

          # 2) 注册（需勾选条款 + 通过验证码）
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"smokeuser\",\"password\":\"SmokePass123\",\"email\":\"smoke@example.com\",\"agreed\":true,\"captcha_ticket\":\"$ticket\",\"captcha_answer\":\"$canswer\"}" \
            "$BASE/api/user/auth/register")
          if [ "$code" != "200" ]; then
            echo "::error::register failed with $code"
            exit 1
          fi
          echo "PASS register with captcha"

          # 3) 注册必须显式同意条款
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"norefuse","password":"SmokePass123"}' \
            "$BASE/api/user/auth/register")
          if [ "$code" = "200" ]; then
            echo "::error::register succeeded without accepting terms"
            exit 1
          fi
          echo "PASS register requires terms acceptance"

          # 4) 统一登录拿 JWT
          login=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"username":"smokeuser","password":"SmokePass123"}' "$BASE/api/auth/login")
          jwt=$(printf '%s' "$login" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$jwt" ]; then
            echo "::error::unified login did not return a token"
            exit 1
          fi
          echo "PASS unified login issues token"

          # 5) 取出 API Key
          reveal=$(curl -fsS -X POST -H "Authorization: Bearer $jwt" "$BASE/api/user/apikey/reveal")
          apikey=$(printf '%s' "$reveal" | sed -n 's/.*"api_key":"\([^"]*\)".*/\1/p')
          if [ -z "$apikey" ]; then
            echo "::error::api key reveal failed"
            exit 1
          fi
          echo "PASS api key issued at registration"

          # 6) 用 API Key 访问（曾经恒 401 的路径）
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $apikey" "$BASE/api/user/client/info")
          if [ "$code" != "200" ]; then
            echo "::error::API key authentication broken (got $code, want 200)"
            exit 1
          fi
          echo "PASS long-lived credential authentication"

          # 7) 伪造的 API Key 必须被拒绝
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer lt_deadbeefdeadbeef_invalid" "$BASE/api/user/client/info")
          if [ "$code" != "401" ]; then
            echo "::error::forged API key was accepted (got $code, want 401)"
            exit 1
          fi
          echo "PASS forged API key rejected"

          # ===== API Key 的权限边界 =====
          # 回归测试：API Key 会以明文落在客户端本地配置文件里，
          # 它的定位是「让客户端连上来」，不是「让持有者接管账号」。
          # 因此只能读，不能写——否则一份泄露的配置就等于账号被接管。

          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $apikey" -H 'Content-Type: application/json' \
            -d '{"nickname":"hacked"}' "$BASE/api/user/profile")
          if [ "$code" != "401" ]; then
            echo "::error::API key could modify profile (got $code, want 401)"
            exit 1
          fi
          echo "PASS api key cannot modify profile"

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $apikey" -H 'Content-Type: application/json' \
            -d '{"name":"evil","type":"tcp","local_ip":"127.0.0.1","local_port":22}' \
            "$BASE/api/user/tunnels")
          if [ "$code" != "401" ]; then
            echo "::error::API key could create a tunnel (got $code, want 401)"
            exit 1
          fi
          echo "PASS api key cannot create tunnel"

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $apikey" "$BASE/api/user/apikey/reveal")
          if [ "$code" != "401" ]; then
            echo "::error::API key could reveal credentials (got $code, want 401)"
            exit 1
          fi
          echo "PASS api key cannot reveal credentials"

          # 但只读接口必须可用，否则客户端就废了
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $apikey" "$BASE/api/user/client/downloads")
          if [ "$code" != "200" ]; then
            echo "::error::API key cannot read client endpoints (got $code, want 200)"
            exit 1
          fi
          echo "PASS api key can read client endpoints"

          # ===== 兑换码并发核销 =====
          # 回归测试：曾经用「读-改-写」更新 used_count，并发下多个事务会读到
          # 同一个旧值并各自写回，丢失更新导致一张一次性码被核销多次。
          # 现已改为条件更新（CAS），由数据库保证只有一个事务能抢到。
          admintoken=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"username":"smokeadmin","password":"SmokeAdminPass123"}' "$BASE/api/auth/login" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$admintoken" ]; then
            echo "::error::admin login failed"
            exit 1
          fi
          echo "PASS admin login"

          gen=$(curl -fsS -X POST -H "Authorization: Bearer $admintoken" \
            -H 'Content-Type: application/json' \
            -d '{"count":1,"type":"balance","value":100,"max_uses":1}' \
            "$BASE/api/admin/redeem-codes/generate")
          redeemcode=$(printf '%s' "$gen" | sed -n 's/.*"code":"\([^"]*\)".*/\1/p')
          if [ -z "$redeemcode" ]; then
            echo "::error::failed to generate redeem code"
            exit 1
          fi

          # 8 个并发请求同时兑换同一张一次性码，只允许 1 个成功
          rm -f /tmp/smoke/redeem_results
          for i in $(seq 1 8); do
            (
              curl -s -o /dev/null -w '%{http_code}\n' -X POST \
                -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' \
                -d "{\"code\":\"$redeemcode\"}" "$BASE/api/user/redeem" \
                >> /tmp/smoke/redeem_results
            ) &
          done
          wait
          okcount=$(grep -c '^200$' /tmp/smoke/redeem_results || true)
          if [ "$okcount" != "1" ]; then
            echo "::error::single-use redeem code was consumed $okcount times (want 1)"
            cat /tmp/smoke/redeem_results
            exit 1
          fi
          echo "PASS redeem code is single-use under concurrency"

          # frps 插件回调：必须能从回环访问
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"version":"0.1.0","op":"Ping","content":{}}' \
            "$BASE/api/frps/plugin")
          if [ "$code" != "200" ]; then
            echo "::error::frps plugin endpoint returned $code"
            exit 1
          fi
          echo "PASS frps plugin endpoint"

          # 管理路由不能在没有令牌的情况下返回业务数据
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/admin/users")
          if [ "$code" != "401" ]; then
            echo "::error::admin API without token returned $code, want 401"
            exit 1
          fi
          echo "PASS admin API requires authentication"

          # 管理后台路径可配置：不带斜杠时应 302 到带斜杠版本
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/smoke-console")
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' "$BASE/smoke-console")
          if [ "$code" != "302" ] || [ "$loc" != "$BASE/smoke-console/" ]; then
            echo "::error::admin path redirect failed (code=$code loc=$loc)"
            exit 1
          fi
          echo "PASS admin path trailing-slash redirect"

          # 自定义路径应返回管理端页面
          body=$(curl -fsS "$BASE/smoke-console/")
          if ! printf '%s' "$body" | grep -q 'ADMIN-CONSOLE'; then
            echo "::error::admin console not served at the configured path"
            exit 1
          fi
          echo "PASS admin console served at the configured path"

          # 默认的 /admin 不再是管理端入口（应落到用户控制台）
          body=$(curl -fsS "$BASE/admin")
          if printf '%s' "$body" | grep -q 'ADMIN-CONSOLE'; then
            echo "::error::/admin still exposes the admin console"
            exit 1
          fi
          echo "PASS /admin no longer exposes the admin console"

          # 暴力破解防护：连续失败后必须被限流/锁定（返回 429）
          locked=0
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' \
              -d '{"username":"bruteforce","password":"wrong-password"}' \
              "$BASE/api/auth/login")
            if [ "$code" = "429" ]; then locked=1; break; fi
          done
          if [ "$locked" != "1" ]; then
            echo "::error::brute force protection did not trigger within 6 attempts"
            exit 1
          fi
          echo "PASS brute force protection (429 after repeated failures)"

          echo "--- startup log ---"
          cat /tmp/smoke/panel.log

      - name: Upload panel binary
        uses: actions/upload-artifact@v4
        with:
          name: panel-linux-amd64
          path: /tmp/panel
          retention-days: 7

  # ============================================================
  #  前端：用户控制台 + 管理后台
  # ============================================================
  web:
    name: Web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: web/${{ matrix.app }}
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: web/${{ matrix.app }}
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.app }}
          path: web/${{ matrix.app }}/dist
          retention-days: 7

  # ============================================================
  #  Windows 客户端（Wails）
  # ============================================================
  client:
    name: Client (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/windows/go.mod
          # client 模块的 go.sum 尚未入库，先关闭缓存
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Resolve dependencies
        working-directory: client/windows
        run: go mod tidy

      - name: Build
        working-directory: client/windows
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;$env:USERPROFILE\go\bin"
          # 这里刻意不注入平台地址：CI 只验证能否构建。
          # 公开仓库的 artifact 任何人可下载，把真实地址烧进去等于对外公开。
          # 带地址的正式安装包由 release.yml 产出。
          wails build -clean -platform windows/amd64

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: LiteTunnel-windows-amd64
          path: client/windows/build/bin/LiteTunnel.exe
          retention-days: 7

  # ============================================================
  #  构建并推送镜像到 GHCR
  #
  #  main 分支每次通过即推送 latest，服务器可直接 pull 部署；
  #  带版本号的镜像由 release.yml 在打 tag 时推送。
  # ============================================================
  publish:
    name: Publish image
    needs: [server, web, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: echo "value=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/litetunnel-panel:latest
            ghcr.io/${{ github.repository_owner }}/litetunnel-panel:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
