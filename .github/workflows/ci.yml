name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  #  控制面：静态检查 + 编译 + 启动冒烟测试
  # ============================================================
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Resolve dependencies
        working-directory: server
        run: go mod tidy

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Build
        working-directory: server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/panel ./cmd/panel

      # 编译通过不代表能启动：数据库 DSN、迁移语句、路由注册等问题
      # 只有真正跑起来才会暴露，这一步把部署风险前移到 CI。
      - name: Smoke test
        working-directory: server
        env:
          LT_ENV: development
          LT_LOG_LEVEL: info
          LT_DB_DRIVER: sqlite
          LT_DB_DSN: /tmp/smoke/litetunnel.db
          LT_USER_ADDR: 127.0.0.1:7848
          LT_ADMIN_ADDR: 127.0.0.1:8443
          LT_GATEWAY_HOST: 127.0.0.1
          LT_GATEWAY_PORT: "7001"
          LT_FRPS_API_ADDR: 127.0.0.1:7500
          LT_CLIENT_DIST_DIR: /tmp/smoke/clients
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke
          /tmp/panel > /tmp/smoke/panel.log 2>&1 &
          PANEL_PID=$!
          trap 'kill $PANEL_PID 2>/dev/null || true' EXIT

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7848/healthz > /dev/null 2>&1; then
              ok=1; break
            fi
            if ! kill -0 $PANEL_PID 2>/dev/null; then
              echo "::error::panel exited during startup"
              cat /tmp/smoke/panel.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::panel did not become healthy in time"
            cat /tmp/smoke/panel.log
            exit 1
          fi
          echo "user console healthz OK"

          curl -fsS http://127.0.0.1:8443/healthz > /dev/null
          echo "admin console healthz OK"

          # 管理路由绝不能出现在公网监听端口上
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' \
            http://127.0.0.1:7848/api/admin/auth/login)
          if [ "$code" != "404" ]; then
            echo "::error::admin API is reachable on the public listener (got $code)"
            exit 1
          fi
          echo "admin API correctly absent from public listener"

          # frps 插件回调必须能从回环访问
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"version":"0.1.0","op":"Ping","content":{}}' \
            http://127.0.0.1:8443/api/frps/plugin)
          if [ "$code" != "200" ]; then
            echo "::error::frps plugin endpoint returned $code"
            exit 1
          fi
          echo "frps plugin endpoint OK"

          echo "--- startup log ---"
          cat /tmp/smoke/panel.log

      - name: Upload panel binary
        uses: actions/upload-artifact@v4
        with:
          name: panel-linux-amd64
          path: /tmp/panel
          retention-days: 7

  # ============================================================
  #  前端：用户控制台 + 管理后台
  # ============================================================
  web:
    name: Web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: web/${{ matrix.app }}
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: web/${{ matrix.app }}
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.app }}
          path: web/${{ matrix.app }}/dist
          retention-days: 7

  # ============================================================
  #  Windows 客户端（Wails）
  # ============================================================
  client:
    name: Client (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/windows/go.mod
          # client 模块的 go.sum 尚未入库，先关闭缓存
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Resolve dependencies
        working-directory: client/windows
        run: go mod tidy

      - name: Build
        working-directory: client/windows
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;$env:USERPROFILE\go\bin"
          wails build -clean -platform windows/amd64

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: LiteTunnel-windows-amd64
          path: client/windows/build/bin/LiteTunnel.exe
          retention-days: 7

  # ============================================================
  #  构建并推送镜像到 GHCR
  #
  #  main 分支每次通过即推送 latest，服务器可直接 pull 部署；
  #  带版本号的镜像由 release.yml 在打 tag 时推送。
  # ============================================================
  publish:
    name: Publish image
    needs: [server, web, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/litetunnel-panel:latest
            ghcr.io/${{ github.repository_owner }}/litetunnel-panel:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
