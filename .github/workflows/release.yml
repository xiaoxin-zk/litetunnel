name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v1.0.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  packages: write

# frp 版本不再写在这里：它由仓库根目录的 frp-version.txt 提供（compose、
# lt-config 默认镜像、systemd 示例都从同一个值校验，见 scripts/check-pins.sh）。
# 发布流程自己再写死一份，就会有「tag 发出去才发现内嵌 frpc 与镜像版本不一致」
# 这种只能靠人工记住的同步点。

jobs:
  # ============================================================
  #  测试门禁：发布前必须先跑通服务端测试。
  #
  #  过去 tag 一推就直接构建发布，一个带 bug 的 tag 也能出去——测试在 CI
  #  里跑、发布流程却从不依赖它们。这里把服务端测试显式前置，构建与产物
  #  一律 needs 它；客户端测试放在 client job 内部（同样先测后打）。
  # ============================================================
  test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 手工发布（workflow_dispatch）必须构建**输入版本号对应的源码**。
          # 不指定 ref 时 checkout 的是默认分支 HEAD，于是可以用今天的 main
          # 打出一个 v0.1.0 的包——版本号与实际内容毫无关系。tag 推送时
          # 显式锁到触发的那次提交，避免推送与检出之间 tag 被移动。
          ref: ${{ github.event.inputs.version || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache: true
          # cache-dependency-path 默认取仓库根目录的 go.sum；本仓库的 go.sum
          # 在 server/ 里，不指定就会「恢复缓存失败：找不到 go.sum」。
          cache-dependency-path: server/go.sum

      - name: Resolve dependencies
        working-directory: server
        run: go mod download

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        run: go test ./...

      # frp 版本同时出现在 compose、systemd 示例与 lt-config 默认镜像里。
      # 三者不一致不会让构建失败，只会让「校验通过的配置」在运行时被 frps
      # 拒绝——所以放在发布门禁里，而不是留给运维去发现。
      - name: frp version pins
        run: bash scripts/check-pins.sh

  # ============================================================
  #  容器镜像推送到 GitHub Container Registry
  # ============================================================
  docker:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [test]
    env:
      # 手工发布与 tag 发布统一到同一个版本变量。
      #
      # 只用 type=ref,event=tag 的话，workflow_dispatch 产生的镜像只有
      # latest 一个 tag，而 Release 正文引用的是输入里那个版本——用户
      # 照着文档 pull 指定版本会得到 manifest unknown。
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 见 test job 的说明：手工发布要锁到输入版本对应的源码。
          # fetch-depth: 0 是为了让下面的 latest 判断能看到全部 tag。
          fetch-depth: 0
          ref: ${{ github.event.inputs.version || github.sha }}

      - name: Validate version
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本必须形如 v1.2.3，当前为 '${VERSION}'"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest 只在「本次发布的就是当前最高版本」时才移动。
      #
      # 否则重新发布旧版本（补丁重打、回滚、手工 dispatch 一个旧号）会把
      # latest 指向旧代码：用户照文档 `pull :latest` 拿到的就是那个旧版本，
      # 而版本 tag 与 latest 的相对关系彻底失去意义——排查时最先看的就是
      # latest 到底指哪儿。git tag 需要完整历史，所以上面的 checkout 要
      # fetch-depth: 0。
      - name: Decide whether latest may move
        id: latest
        run: |
          set -euo pipefail
          newest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [[ "${newest}" == "${VERSION}" ]]; then
            echo "enable=true" >> "$GITHUB_OUTPUT"
            echo "推送 latest：${VERSION} 是当前最高版本"
          else
            echo "enable=false" >> "$GITHUB_OUTPUT"
            echo "不推送 latest：当前最高版本是 ${newest}，本次发布 ${VERSION}"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/litetunnel-panel
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          # 把 tag 注入二进制，部署后可通过 /healthz 确认版本
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  #  Windows 客户端（内置 frpc，开箱即用）
  # ============================================================
  client:
    name: Package Windows client
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # 见 test job 的说明：手工发布要锁到输入版本对应的源码。
          ref: ${{ github.event.inputs.version || github.sha }}

      - name: Validate version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+$') {
            throw "版本必须形如 v1.2.3，当前为 '$env:VERSION'"
          }

      # 内嵌 frpc 的版本来自仓库里的唯一来源文件，不再由本工作流写死。
      - name: Load frp version
        shell: pwsh
        run: |
          $v = (Get-Content -LiteralPath frp-version.txt -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "frp-version.txt 内容不是 x.y.z：'$v'"
          }
          "FRP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "frp $v"

      - uses: actions/setup-go@v6
        with:
          go-version-file: client/windows/go.mod
          cache: true
          # 同 server 侧：go.sum 在子目录里，不指定就会「找不到 go.sum」。
          cache-dependency-path: client/windows/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Wails CLI
        working-directory: client/windows
        shell: pwsh
        run: |
          # 版本跟随 go.mod，而不是 @latest：latest 会在两次发布之间漂移，
          # 同一份源码重发可能产出不同的客户端（构建器行为与生成代码都会变）。
          $v = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          if (-not $v) { throw '无法从 go.mod 解析 wails 版本' }
          Write-Host "Installing wails $v"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$v"

      - name: Resolve dependencies
        working-directory: client/windows
        run: go mod download

      # 只能 vet 子包：main 包依赖 //go:embed all:frontend/dist，而 dist 是
      # wails build 的产物、不入库。`go vet ./...` 会把 main 包一起解析，
      # 于是直接报 "pattern all:frontend/dist: no matching files"。
      # main 包的 vet 与测试放在构建之后（见下方 Vet (main package)）。
      - name: Vet (internal)
        working-directory: client/windows
        run: go vet ./internal/...

      # 发布前先测后打：这里复制 CI 的客户端测试，保证 tag 发布与日常 CI
      # 至少跑同一套用例。构建失败可以重来，发布出去的 bug 没法回收。
      - name: Unit tests (internal)
        working-directory: client/windows
        run: go test ./internal/...

      # 必须先于构建执行：go:embed 在**编译期**读取文件，
      # 顺序反了会直接编译失败（找不到 assets/frpc.exe）。
      - name: Download frpc
        shell: pwsh
        run: |
          $ver = $env:FRP_VERSION
          $url = "https://github.com/fatedier/frp/releases/download/v$ver/frp_${ver}_windows_amd64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile frp.zip
          # 校验下载内容：仅固定版本号不能证明拿到的是官方那一份（镜像劫持、
          # 代理缓存污染都可能换掉字节）。官方 release 附带校验和文件。
          #
          # 文件名**不是** frp_<ver>_checksums.txt（那是想当然的写法，产物里
          # 根本没有，下载必然 404）：frp 的 release 里只有一个固定名字的
          # frp_sha256_checksums.txt，里面的条目形如
          #   <sha256>  frp_<ver>_windows_amd64.zip
          $sumsUrl = "https://github.com/fatedier/frp/releases/download/v$ver/frp_sha256_checksums.txt"
          Invoke-WebRequest -Uri $sumsUrl -OutFile checksums.txt
          $line = Get-Content checksums.txt | Where-Object { $_.Trim() -match "frp_${ver}_windows_amd64\.zip$" } | Select-Object -First 1
          if (-not $line) { throw "checksums.txt 中没有 windows_amd64 的条目" }
          $want = ($line.Trim() -split '\s+')[0].ToLower()
          $got = (Get-FileHash frp.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) {
            throw "frp 压缩包校验失败：期望 $want，实际 $got"
          }
          Expand-Archive -Path frp.zip -DestinationPath frp -Force
          $exe = Get-ChildItem -Path frp -Recurse -Filter frpc.exe | Select-Object -First 1
          if (-not $exe) { throw 'frpc.exe not found in frp release archive' }
          New-Item -ItemType Directory -Force -Path client/windows/assets | Out-Null
          Copy-Item $exe.FullName -Destination client/windows/assets/frpc.exe -Force
          $lic = Get-ChildItem -Path frp -Recurse -Filter LICENSE | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName -Destination client/windows/assets/LICENSE-frp.txt -Force }

      - name: Build client
        working-directory: client/windows
        shell: pwsh
        env:
          # 用 Secret 而非 Variable：公开仓库的 Variables 任何人可读，
          # 那等于把地址写在公告板上。Secret 不会对外暴露。
          LT_CLIENT_SERVER: ${{ secrets.LT_CLIENT_SERVER }}
        run: |
          $env:PATH = "$env:PATH;$env:USERPROFILE\go\bin"
          # 把平台地址烧进客户端，用户只需粘贴 API Key，不必填服务器地址。
          if (-not $env:LT_CLIENT_SERVER) {
            Write-Host "::warning::LT_CLIENT_SERVER 未设置，客户端将回退为手动填写服务器地址"
          }
          # -tags embedfrpc：把上面下载的 frpc 内嵌进主程序，
          # 用户最终只拿到**一个 exe**。
          # 同时注入平台地址与版本号，版本号会显示在客户端界面上，
          # 用户报障时能直接说出自己在跑哪个版本。
          wails build -clean -platform windows/amd64 -tags embedfrpc -ldflags "-X main.buildServerURL=$env:LT_CLIENT_SERVER -X main.buildVersion=$env:VERSION"

      # main 包依赖 //go:embed all:frontend/dist，dist 由上面的 wails build
      # 生成，所以 vet 与测试都排在构建之后。构建之前的门禁只覆盖子包。
      - name: Vet (main package)
        working-directory: client/windows
        run: go vet .

      - name: Unit tests (main package)
        working-directory: client/windows
        run: go test .

      # -tags embedfrpc 只在发布路径上启用，日常 CI 走不到：内嵌文件是空文件、
      # 是错误页、或下载后被截断，编译与打包都不会报错，只有用户双击后才发现
      # 内置客户端释放不出来。这里在构建前直接检查字节（PE 头 + 体积下限）。
      - name: Embedded frpc smoke test
        working-directory: client/windows
        run: go test -tags embedfrpc -run TestEmbeddedFrpc .

      - name: Assemble package
        shell: pwsh
        run: |
          $bin = 'client/windows/build/bin'
          # 注意：这里不能用 PowerShell here-string，其结束符必须顶格，
          # 会破坏 YAML 块标量，因此改用数组拼接。
          $bundleLic = 'client/windows/assets/LICENSE-frp.txt'
          if (Test-Path $bundleLic) { Copy-Item $bundleLic -Destination "$bin/LICENSE-frp.txt" -Force }
          $readme = @(
            'LiteTunnel Windows Client',
            '=========================',
            '',
            'Quick start',
            '-----------',
            '1. Run LiteTunnel.exe (single file, no installation needed).',
            '2. Paste your API Key from the console, then click "Connect".',
            '3. Tunnels are pulled from the server automatically and stay in sync.',
            '',
            'Notes',
            '-----',
            '- The client bundles frpc internally, so there is nothing else to copy.',
            '- It stores only a revocable API Key, never your password.',
            '- Config, logs and the extracted frpc live in %AppData%\LiteTunnel',
            '- frpc is bundled from the official frp release (Apache-2.0), see LICENSE-frp.txt'
          ) -join "`n"
          Set-Content -Path "$bin/README-client.txt" -Value $readme -Encoding UTF8
          Compress-Archive -Path "$bin/*" -DestinationPath LiteTunnel-windows-amd64.zip -Force

      # 校验和随产物一起发布：用户拿到 zip 后能自己确认「下载没被中间层改过」，
      # 这是我们在下载端唯一还能提供的完整性证据。
      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath LiteTunnel-windows-amd64.zip -Algorithm SHA256).Hash.ToLower()
          $line = "$hash  LiteTunnel-windows-amd64.zip`n"
          [IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'LiteTunnel-windows-amd64.zip.sha256'),
            $line,
            (New-Object System.Text.UTF8Encoding($false)))

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: LiteTunnel-windows-amd64
          path: |
            LiteTunnel-windows-amd64.zip
            LiteTunnel-windows-amd64.zip.sha256

  # ============================================================
  #  服务端部署包（不含任何真实地址，全部为模板）
  # ============================================================
  deploy-bundle:
    name: Package deploy bundle
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.version || github.sha }}

      - name: Assemble
        run: |
          # 目录结构必须与仓库一致：README 里的命令都按 deploy/xxx 书写，
          # 包里少一层或换个名字，用户就只能自己猜。
          mkdir -p bundle/deploy/frps bundle/deploy/caddy bundle/deploy/scripts bundle/deploy/systemd
          cp deploy/docker-compose.yml bundle/deploy/
          cp deploy/frps/frps.toml.template bundle/deploy/frps/
          cp deploy/caddy/Caddyfile.template bundle/deploy/caddy/
          # Caddyfile 里要配 DNS Challenge 就必须自建镜像（官方镜像不含任何
          # dns 插件），少了这个 Dockerfile，用户照文档走也构建不出来——
          # 只会得到一句 unrecognized directive: dns。
          cp deploy/caddy/Dockerfile bundle/deploy/caddy/
          cp deploy/scripts/render.sh deploy/scripts/render.ps1 bundle/deploy/scripts/
          # 防火墙 helper 与域名配置服务（lt-config）的 systemd 单元：
          # 后台「域名与证书」依赖后者，包里没有就得回仓库里翻。
          cp deploy/systemd/* bundle/deploy/systemd/
          cp .env.example README.md bundle/
          # 渲染脚本的回归夹具也进包：用户/运维改了脚本之后可以在本地先跑一遍，
          # 不需要等仓库 CI。它不依赖仓库里的其他文件（只用 .env.example 与模板）。
          mkdir -p bundle/scripts
          cp scripts/test-render.sh scripts/check-pins.sh bundle/scripts/
          cp frp-version.txt bundle/
          cd bundle && zip -r ../litetunnel-deploy.zip .

      - name: Generate checksum
        run: sha256sum litetunnel-deploy.zip > litetunnel-deploy.zip.sha256

      - name: Upload bundle
        uses: actions/upload-artifact@v6
        with:
          name: litetunnel-deploy
          path: |
            litetunnel-deploy.zip
            litetunnel-deploy.zip.sha256

  # ============================================================
  #  创建 Release 并挂载产物
  # ============================================================
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    # docker 必须在列：Release 正文会写出 ghcr.io/...:<version> 这个镜像地址。
    # 不依赖它时，镜像构建失败而 Release 照发——用户照着正文 pull 得到
    # manifest unknown，而 Release 页面看起来一切正常。
    needs: [test, client, deploy-bundle, docker]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.version || github.sha }}

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        with:
          name: LiteTunnel-windows-amd64
          path: assets

      - uses: actions/download-artifact@v7
        with:
          name: litetunnel-deploy
          path: assets

      # 挂上去之前先自查一遍：产物缺失或校验和与产物不匹配时，宁可让发布
      # 失败，也不要发出一个「sha256 对不上」的版本——那比没有校验和更糟，
      # 用户会以为下载被篡改了。
      - name: Verify artifacts
        run: |
          set -euo pipefail
          for f in assets/LiteTunnel-windows-amd64.zip assets/litetunnel-deploy.zip; do
            [[ -f "$f" ]] || { echo "::error::缺少产物 $f"; exit 1; }
          done
          ( cd assets && sha256sum -c LiteTunnel-windows-amd64.zip.sha256 litetunnel-deploy.zip.sha256 )

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: LiteTunnel ${{ steps.ver.outputs.version }}
          draft: true
          # 重发同一个版本号（tag 挪到新提交后重跑）时必须覆盖旧产物。
          # 不覆盖的话上传会因为「asset already exists」失败，而那时镜像和
          # Release 正文已经是新的——用户看到的正文与下载的包对不上。
          overwrite_files: true
          generate_release_notes: true
          body: |
            ## 产物说明

            | 文件 | 用途 |
            |---|---|
            | `LiteTunnel-windows-amd64.zip` | Windows 客户端，已内置 frpc.exe，解压即用 |
            | `litetunnel-deploy.zip` | 服务端部署包（compose / frps 模板 / Caddy 模板 / .env 模板） |
            | `*.zip.sha256` | 产物的 SHA-256 校验和，下载后可核对 |

            容器镜像：`ghcr.io/${{ github.repository_owner }}/litetunnel-panel:${{ steps.ver.outputs.version }}`

            ## 校验下载
            ```bash
            sha256sum -c LiteTunnel-windows-amd64.zip.sha256   # Linux
            shasum -a 256 -c LiteTunnel-windows-amd64.zip.sha256  # macOS
            # Windows: Get-FileHash LiteTunnel-windows-amd64.zip -Algorithm SHA256
            ```

            ## 服务端部署

            ```bash
            docker login ghcr.io -u <你的用户名> -p <带 read:packages 权限的 PAT>
            # 压缩包的根就是部署包本身（.env.example / README.md / deploy/），
            # 没有额外的 bundle 目录。
            unzip -d litetunnel-deploy litetunnel-deploy.zip && cd litetunnel-deploy
            cp .env.example .env && vi .env          # 填写域名与各项密钥
            bash deploy/scripts/render.sh            # 渲染 frps.toml 与 Caddyfile
            docker compose --env-file .env -f deploy/docker-compose.yml pull
            docker compose --env-file .env -f deploy/docker-compose.yml up -d
            ```
          files: |
            assets/LiteTunnel-windows-amd64.zip
            assets/LiteTunnel-windows-amd64.zip.sha256
            assets/litetunnel-deploy.zip
            assets/litetunnel-deploy.zip.sha256
