name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  #  控制面：静态检查 + 编译 + 启动冒烟测试
  # ============================================================
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true

      - name: Resolve dependencies
        working-directory: server
        run: go mod tidy

      - name: Vet
        working-directory: server
        run: go vet ./...

      # 纯逻辑单元测试（不依赖数据库与网络）。
      # 目前覆盖 TOTP 的窗口边界与防重放语义——这两处的错误都不会在
      # 编译期或冒烟测试中暴露：窗口放宽了不会报错，防重放失效也不会。
      - name: Unit tests
        working-directory: server
        run: go test ./... 2>&1

      - name: Build
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X github.com/xiaoxin-zk/litetunnel/server/internal/config.Version=ci-${GITHUB_SHA::7}" \
            -o /tmp/panel ./cmd/panel

      # 编译通过不代表能启动：数据库 DSN、迁移语句、路由注册等问题
      # 只有真正跑起来才会暴露，这一步把部署风险前移到 CI。
      - name: Smoke test
        working-directory: server
        # 超时护栏：脚本里一旦出现「等一个不会结束的进程」这类问题，
        # 默认会一直挂到工作流上限（6 小时），白白烧掉额度。
        timeout-minutes: 5
        env:
          LT_ENV: development
          LT_LOG_LEVEL: info
          LT_DB_DRIVER: sqlite
          LT_DB_DSN: /tmp/smoke/litetunnel.db
          LT_USER_ADDR: 127.0.0.1:7848
          LT_GATEWAY_HOST: 127.0.0.1
          LT_GATEWAY_PORT: "7001"
          LT_FRPS_API_ADDR: 127.0.0.1:7500
          LT_CLIENT_DIST_DIR: /tmp/smoke/clients
          # 用非默认值验证管理后台路径可配置
          LT_ADMIN_PATH: /smoke-console
          LT_USER_WEB_DIR: /tmp/smoke/userweb
          LT_ADMIN_WEB_DIR: /tmp/smoke/adminweb
          # 固定管理员口令：冒烟测试要用管理员身份验证管理接口（生成兑换码等）
          LT_BOOTSTRAP_ADMIN_USER: smokeadmin
          LT_BOOTSTRAP_ADMIN_PASSWORD: SmokeAdminPass123
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:7848
          # 最小前端产物，用于验证两套 SPA 的挂载与路径隔离
          mkdir -p /tmp/smoke/userweb/assets /tmp/smoke/adminweb/assets
          printf '<html>USER-CONSOLE</html>' > /tmp/smoke/userweb/index.html
          printf '<html>ADMIN-CONSOLE</html>' > /tmp/smoke/adminweb/index.html
          /tmp/panel > /tmp/smoke/panel.log 2>&1 &
          PANEL_PID=$!
          trap 'kill $PANEL_PID 2>/dev/null || true' EXIT

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "$BASE/healthz" > /dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 $PANEL_PID 2>/dev/null; then
              echo "::error::panel exited during startup"; cat /tmp/smoke/panel.log; exit 1
            fi
            sleep 1
          done
          [ "$ok" = "1" ] || { echo "::error::panel did not become healthy"; cat /tmp/smoke/panel.log; exit 1; }
          echo "PASS healthz"

          # 版本号必须能从 /healthz 读到，部署后才好确认线上跑的是哪个版本
          ver=$(curl -fsS "$BASE/healthz" | grep -o '"version":"[^"]*"' || true)
          if ! printf '%s' "$ver" | grep -q 'ci-'; then
            echo "::error::version not injected into the binary (got '$ver')"
            exit 1
          fi
          echo "PASS build version injected ($ver)"

          # 统一登录入口：账号密码错误应返回 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"username":"x","password":"y"}' \
            "$BASE/api/auth/login")
          if [ "$code" != "401" ]; then
            echo "::error::unified login returned $code, want 401"
            exit 1
          fi
          echo "PASS unified login endpoint"

          # 旧的独立登录入口必须已下线，避免留下第二条可爆破路径
          for old in /api/user/auth/login /api/admin/auth/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -d '{"username":"x","password":"y"}' \
              "$BASE$old")
            if [ "$code" != "404" ]; then
              echo "::error::$old still reachable (got $code), want 404"
              exit 1
            fi
          done
          echo "PASS legacy login endpoints removed"

          # 公共站点信息：登录前就要能读到
          body=$(curl -fsS "$BASE/api/public/settings")
          if ! printf '%s' "$body" | grep -q 'register_enabled'; then
            echo "::error::public settings endpoint missing expected fields"
            exit 1
          fi
          # 公共接口绝不能泄露密钥类字段
          if printf '%s' "$body" | grep -qiE 'password|secret|smtp\.'; then
            echo "::error::public settings leaked sensitive fields"
            exit 1
          fi
          echo "PASS public settings (no sensitive fields)"

          # ===== 长期凭据认证链路 =====
          # 这段是回归测试：曾经因为「凭据路径传版本号 0、而账号版本号默认 1」
          # 导致 API Key 与客户端凭据认证一律 401，整套客户端不可用。
          # 冒烟测试当时只覆盖了 JWT 路径，没能拦住，所以这里把完整链路补上。

          # 1) 取验证码并解出答案（算术题：a + b 或 a - b）
          cap=$(curl -fsS "$BASE/api/public/captcha")
          ticket=$(printf '%s' "$cap" | sed -n 's/.*"ticket":"\([^"]*\)".*/\1/p')
          question=$(printf '%s' "$cap" | sed -n 's/.*"question":"\([^"]*\)".*/\1/p')
          if [ -z "$ticket" ] || [ -z "$question" ]; then
            echo "::error::captcha endpoint did not return ticket/question"
            exit 1
          fi
          ca=$(printf '%s' "$question" | awk '{print $1}')
          cop=$(printf '%s' "$question" | awk '{print $2}')
          cb=$(printf '%s' "$question" | awk '{print $3}')
          if [ "$cop" = "+" ]; then canswer=$((ca + cb)); else canswer=$((ca - cb)); fi
          echo "PASS captcha issued ($question -> $canswer)"

          # 2) 注册（需勾选条款 + 通过验证码）
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"smokeuser\",\"password\":\"SmokePass123\",\"email\":\"smoke@example.com\",\"agreed\":true,\"captcha_ticket\":\"$ticket\",\"captcha_answer\":\"$canswer\"}" \
            "$BASE/api/user/auth/register")
          if [ "$code" != "200" ]; then
            echo "::error::register failed with $code"
            exit 1
          fi
          echo "PASS register with captcha"

          # 3) 注册必须显式同意条款。
          #    这里刻意断言具体的 400 而不是「非 200」：
          #    新增的业务错误若忘了在 shared.Fail 里映射，会掉进 default
          #    分支变成 500，而「非 200」这种宽松断言根本发现不了。
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"norefuse","password":"SmokePass123"}' \
            "$BASE/api/user/auth/register")
          if [ "$code" != "400" ]; then
            echo "::error::register without terms returned $code, want 400"
            exit 1
          fi
          echo "PASS register requires terms acceptance"

          # 3b) 图形验证码错误同样必须是 400 而不是 500
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"badcaptcha","password":"SmokePass123","agreed":true,"captcha_ticket":"forged","captcha_answer":"1"}' \
            "$BASE/api/user/auth/register")
          if [ "$code" != "400" ]; then
            echo "::error::bad captcha returned $code, want 400 (500 means the error is unmapped)"
            exit 1
          fi
          echo "PASS bad captcha maps to 400"

          # 3c) 伪造的重置令牌必须是 401，不能是 500
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"token":"deadbeef","password":"SmokePass123"}' \
            "$BASE/api/user/auth/reset-password")
          if [ "$code" != "401" ]; then
            echo "::error::invalid reset token returned $code, want 401"
            exit 1
          fi
          echo "PASS invalid reset token maps to 401"

          # 4) 统一登录拿 JWT
          login=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"username":"smokeuser","password":"SmokePass123"}' "$BASE/api/auth/login")
          jwt=$(printf '%s' "$login" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$jwt" ]; then
            echo "::error::unified login did not return a token"
            exit 1
          fi
          echo "PASS unified login issues token"

          # 5) 取出 API Key
          reveal=$(curl -fsS -X POST -H "Authorization: Bearer $jwt" "$BASE/api/user/apikey/reveal")
          apikey=$(printf '%s' "$reveal" | sed -n 's/.*"api_key":"\([^"]*\)".*/\1/p')
          if [ -z "$apikey" ]; then
            echo "::error::api key reveal failed"
            exit 1
          fi
          echo "PASS api key issued at registration"

          # 6) 用 API Key 访问（曾经恒 401 的路径）
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $apikey" "$BASE/api/user/client/info")
          if [ "$code" != "200" ]; then
            echo "::error::API key authentication broken (got $code, want 200)"
            exit 1
          fi
          echo "PASS long-lived credential authentication"

          # 7) 伪造的 API Key 必须被拒绝
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer lt_deadbeefdeadbeef_invalid" "$BASE/api/user/client/info")
          if [ "$code" != "401" ]; then
            echo "::error::forged API key was accepted (got $code, want 401)"
            exit 1
          fi
          echo "PASS forged API key rejected"

          # ===== 权限边界：使用账号 vs 控制账号 =====
          #
          # API Key 会以明文落在客户端本地配置文件里，因此它必须能完成
          # 客户端该做的事（建隧道、兑换），但不能做「账号接管」类操作。
          #
          # 这条线改动时最容易改错方向，所以两个方向都要有断言守着。
          #
          # 关于状态码：账号安全接口现在的守卫是 RequireSession，它返回
          # **403**（已认证但无权限），而不是 401。这是刻意的——API Key
          # 本身是有效凭据，只是没有这项权限，用 403 语义更准确。
          # 断言 403 而不是「非 200」，是为了区分「被权限挡住」与
          # 「路由根本不存在」这两种情况。

          # ---- 必须能做 ----

          # 建隧道：这是客户端存在的意义
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $apikey" -H 'Content-Type: application/json' \
            -d '{"name":"citunnel","type":"tcp","local_ip":"127.0.0.1","local_port":25565}' \
            "$BASE/api/user/tunnels")
          if [ "$code" != "200" ]; then
            echo "::error::API key cannot create a tunnel (got $code, want 200)"
            exit 1
          fi
          echo "PASS api key can create tunnel"

          # 建完应当能读到，并且公网地址已由服务端分配。
          # 检查 public_addr 而不是 remote_port：后者不一定出现在 VO 里，
          # 拿它做断言会变成一条永远通过的空断言。
          body=$(curl -fsS -H "Authorization: Bearer $apikey" "$BASE/api/user/client/info")
          if ! printf '%s' "$body" | grep -q '"name":"citunnel"'; then
            echo "::error::created tunnel not visible via client info"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q '"public_addr":"[^"]'; then
            echo "::error::server did not allocate a public address for the new tunnel"
            exit 1
          fi
          echo "PASS server auto-allocated a port for the new tunnel"

          # 兑换：用不存在的码，只要不是 401/403/404 就说明接口可达
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $apikey" -H 'Content-Type: application/json' \
            -d '{"code":"LT-AAAA-AAAA-AAAA"}' "$BASE/api/user/redeem")
          if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "404" ]; then
            echo "::error::API key cannot reach redeem endpoint (got $code)"
            exit 1
          fi
          echo "PASS api key can reach redeem endpoint"

          # ---- 必须不能做（全部期望 403）----

          check_forbidden() {
            # $1=说明 $2=curl 的其余参数拼接结果
            local label="$1"
            shift
            local got
            got=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            if [ "$got" != "403" ]; then
              echo "::error::API key could $label (got $got, want 403)"
              exit 1
            fi
            echo "PASS api key cannot $label"
          }

          check_forbidden "modify profile" \
            -X PUT -H "Authorization: Bearer $apikey" -H 'Content-Type: application/json' \
            -d '{"nickname":"hacked"}' "$BASE/api/user/profile"

          check_forbidden "change password" \
            -X PUT -H "Authorization: Bearer $apikey" -H 'Content-Type: application/json' \
            -d '{"old_password":"SmokePass123","new_password":"HackedPass123"}' \
            "$BASE/api/user/profile/password"

          check_forbidden "reveal credentials" \
            -X POST -H "Authorization: Bearer $apikey" "$BASE/api/user/apikey/reveal"

          # 能重置自己的 Key 就等于能复制身份
          check_forbidden "rotate itself" \
            -X POST -H "Authorization: Bearer $apikey" "$BASE/api/user/apikey/rotate"

          check_forbidden "delete account" \
            -X DELETE -H "Authorization: Bearer $apikey" -H 'Content-Type: application/json' \
            -d '{"password":"SmokePass123"}' "$BASE/api/user/profile"

          # ---- 只读接口必须可用 ----
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $apikey" "$BASE/api/user/client/downloads")
          if [ "$code" != "200" ]; then
            echo "::error::API key cannot read client endpoints (got $code, want 200)"
            exit 1
          fi
          echo "PASS api key can read client endpoints"

          # ===== 兑换码并发核销 =====
          # 回归测试：曾经用「读-改-写」更新 used_count，并发下多个事务会读到
          # 同一个旧值并各自写回，丢失更新导致一张一次性码被核销多次。
          # 现已改为条件更新（CAS），由数据库保证只有一个事务能抢到。
          admintoken=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"username":"smokeadmin","password":"SmokeAdminPass123"}' "$BASE/api/auth/login" \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$admintoken" ]; then
            echo "::error::admin login failed"
            exit 1
          fi
          echo "PASS admin login"

          gen=$(curl -fsS -X POST -H "Authorization: Bearer $admintoken" \
            -H 'Content-Type: application/json' \
            -d '{"count":1,"type":"balance","value":100,"max_uses":1}' \
            "$BASE/api/admin/redeem-codes/generate")
          # 响应形如 {"data":{"batch_no":"...","count":1,"codes":["LT-XXXX-XXXX-XXXX"]}}
          redeemcode=$(printf '%s' "$gen" | sed -n 's/.*"codes":\["\([^"]*\)".*/\1/p')
          if [ -z "$redeemcode" ]; then
            echo "::error::failed to generate redeem code"
            exit 1
          fi

          # 8 个并发请求同时兑换同一张一次性码，只允许 1 个成功。
          #
          # 必须收集 PID 后精确 wait：不带参数的 wait 会连前面用 & 启动的
          # panel 进程一起等，导致脚本永远不返回（CI 会挂到超时）。
          rm -f /tmp/smoke/redeem_results
          redeem_pids=""
          for i in $(seq 1 8); do
            (
              curl -s -o /dev/null -w '%{http_code}\n' -X POST \
                -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' \
                -d "{\"code\":\"$redeemcode\"}" "$BASE/api/user/redeem" \
                >> /tmp/smoke/redeem_results
            ) &
            redeem_pids="$redeem_pids $!"
          done
          # shellcheck disable=SC2086
          wait $redeem_pids
          okcount=$(grep -c '^200$' /tmp/smoke/redeem_results || true)
          if [ "$okcount" != "1" ]; then
            echo "::error::single-use redeem code was consumed $okcount times (want 1)"
            cat /tmp/smoke/redeem_results
            exit 1
          fi
          echo "PASS redeem code is single-use under concurrency"

          # ===== 系统监控接口 =====
          # 这条断言守的是「路由还在、字段还在」。监控接口是纯读的，
          # 出错时不会有人立刻发现——页面上的图只是空着，看起来像
          # 「刚好没有数据」。
          body=$(curl -fsS -H "Authorization: Bearer $admintoken" "$BASE/api/admin/system/metrics")
          for field in '"latest"' '"series"' '"sample_interval"' '"max_samples"'; do
            if ! printf '%s' "$body" | grep -q "$field"; then
              echo "::error::system metrics missing field $field"
              exit 1
            fi
          done
          # 采集必须真的读到宿主机数据，而不是返回一堆 0。
          # CPU 核数在任何 Linux 上都大于 0，为 0 说明 /proc 没读到。
          if printf '%s' "$body" | grep -q '"cpu_cores":0'; then
            echo "::error::system metrics did not read host CPU info"
            exit 1
          fi
          echo "PASS admin system metrics endpoint"

          # ===== 限速显示的一致性 =====
          #
          # 覆盖范围（务必如实理解，别把它当成万能的）：
          #   守住的是「显示口径」与「取值链路」——
          #     - 文案必须是 bit 口径（4 Mbps），用 frp 的字节口径会变成
          #       512.00KB。两个数字其实相等，但用户看不出是同一回事，
          #       只会以为自己被少给了带宽。
          #     - 分组限速改完必须立刻反映到用户侧接口上，
          #       取值链路断了会显示成空或旧值。
          #
          #   守不住的是「快照与分组不一致」这个场景本身：CI 里改分组时，
          #   传播逻辑会顺带把快照也刷成新值，两边恰好一致，看不出差别。
          #   要构造出真正的不一致得让用户的 group_id 指不到分组
          #  （例如分组过期后回落到默认分组），代价过高且脆弱。
          #   那个场景靠「统一以分组为唯一来源」这个设计消除，
          #   而不是靠这条断言。
          #
          # 换句话说：这条断言防的是「口径改回去」和「链路断掉」，
          # 防不了「有人又把快照读了回来」——后者需要 code review 把关。
          # 取**用户当前所在的分组**来改，而不是「分组列表里的第一项」。
          #
          # 列表按优先级排序，第一项是「专业版」（100 Mbps、不限隧道数），
          # 而测试用户默认落在「免费版」（4 Mbps、2 条隧道）上。
          # 改错分组对用户毫无影响，断言却会通过——那是一条永远为真的
          # 空断言。而且后面的批量创建需要容量，改错分组还会让它在
          # 分组上限处失败，看起来像是批量功能坏了。
          cinfo=$(curl -fsS -H "Authorization: Bearer $apikey" "$BASE/api/user/client/info")
          # 分组对象是 gin.H（map），JSON 的键按字母序输出，
          # 不能假设 id 在前面。先整体切出 group，再逐项取。
          gjson=$(printf '%s' "$cinfo" | sed -n 's/.*"group":{\([^}]*\)}.*/\1/p')
          gid=$(printf '%s' "$gjson" | sed -n 's/.*"id":\([0-9]*\).*/\1/p')
          gname=$(printf '%s' "$gjson" | sed -n 's/.*"name":"\([^"]*\)".*/\1/p')
          if [ -z "$gid" ] || [ -z "$gname" ]; then
            echo "::error::could not resolve the user group (id=$gid name=$gname)"
            echo "client info: $cinfo"
            exit 1
          fi
          # 把分组限速设成 4 Mbps（4194304 bit/s）
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $admintoken" -H 'Content-Type: application/json' \
            -d "{\"name\":\"$gname\",\"max_tunnels\":20,\"max_ports\":20,\"traffic_quota\":0,\"bandwidth_limit\":4194304,\"allow_protocols\":\"tcp,udp,http,https\",\"allow_custom_domain\":false,\"allow_privileged_port\":false,\"priority\":0}" \
            "$BASE/api/admin/groups/$gid")
          if [ "$code" != "200" ]; then
            echo "::error::update group bandwidth returned $code"
            exit 1
          fi

          # 用户侧：隧道列表里的限速必须与分组一致，且是 bit 口径的文案。
          # 用 frp 的字节口径（FormatBandwidth）会显示成 512.00KB —— 两个
          # 数字其实相等，但用户看不出是同一回事，只会以为被少给了带宽。
          tlist=$(curl -fsS -H "Authorization: Bearer $apikey" "$BASE/api/user/tunnels")
          tlimit=$(printf '%s' "$tlist" | grep -o '"bandwidth_limit_str":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ "$tlimit" != "4 Mbps" ]; then
            echo "::error::tunnel bandwidth shows '$tlimit', want '4 Mbps' (group=4Mbps)"
            exit 1
          fi

          info=$(curl -fsS -H "Authorization: Bearer $apikey" "$BASE/api/user/client/info")
          glimit=$(printf '%s' "$info" | grep -o '"bandwidth_limit_str":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ "$glimit" != "4 Mbps" ]; then
            echo "::error::client group bandwidth shows '$glimit', want '4 Mbps'"
            exit 1
          fi
          echo "PASS bandwidth limit is consistent and human-readable"

          # ---- 批量创建 ----
          #
          # 必须放在「分组上限已调大」之后：默认分组的 max_tunnels 很小，
          # 批量创建会被上限拦下并提前结束——那样失败的不是批量功能，
          # 而是这条断言自己没准备好前置条件。
          batchresp=$(curl -fsS -X POST \
            -H "Authorization: Bearer $apikey" -H 'Content-Type: application/json' \
            -d '{"name_prefix":"cibatch","type":"tcp","local_ip":"127.0.0.1","ports":[25566,25567,25568]}' \
            "$BASE/api/user/tunnels/batch")
          body=$(curl -fsS -H "Authorization: Bearer $apikey" "$BASE/api/user/client/info")
          for n in cibatch_25566 cibatch_25567 cibatch_25568; do
            if ! printf '%s' "$body" | grep -q "\"name\":\"$n\""; then
              echo "::error::batch tunnel $n was not created"
              # 批量接口会把每条失败的原因单独返回，直接打出来——
              # 只说「没建出来」会让人只能靠猜。
              echo "batch response: $batchresp"
              exit 1
            fi
          done
          # 接口返回的 created 必须是**真实隧道**，而不是零值。
          #
          # 曾经 CreateTunnel 里声明的 created 变量从未被赋值
          # （tx.Create 填的是另一个变量），于是创建接口返回
          # id=0、name 为空的对象。因为调用方大多紧接着重新拉一次列表，
          # 这个错误长期没被任何断言发现。
          if ! printf '%s' "$batchresp" | grep -q '"name":"cibatch_25566"'; then
            echo "::error::create response contains a zero-value tunnel"
            echo "batch response: $batchresp"
            exit 1
          fi
          if printf '%s' "$batchresp" | grep -q '"id":0'; then
            echo "::error::create response tunnel has id=0"
            echo "batch response: $batchresp"
            exit 1
          fi
          echo "PASS batch tunnel creation"

          # 超出单次上限必须被拒，而不是默默只建前 20 条——
          # 静默截断会让用户以为剩下的也建好了。
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $apikey" -H 'Content-Type: application/json' \
            -d '{"name_prefix":"citoo","type":"tcp","local_ip":"127.0.0.1","ports":[30001,30002,30003,30004,30005,30006,30007,30008,30009,30010,30011,30012,30013,30014,30015,30016,30017,30018,30019,30020,30021]}' \
            "$BASE/api/user/tunnels/batch")
          if [ "$code" != "400" ]; then
            echo "::error::oversized batch was not rejected (got $code, want 400)"
            exit 1
          fi
          echo "PASS oversized batch rejected"

          # ---- 按隧道下发配置 ----
          #
          # 客户端为**每条隧道**单独托管一个 frpc 进程，因此需要能只取
          # 某一条隧道的配置。这里断言的是「恰好只含这一条」：
          # 混进别的 [[proxies]]，这条隧道的进程就会顺手把其他隧道也建起来，
          # 于是「关掉一条隧道」变成关不掉——它会被隔壁的进程重新拉起来。
          cinfo2=$(curl -fsS -H "Authorization: Bearer $apikey" "$BASE/api/user/client/info")
          # 把每个隧道对象拆到单独一行再匹配名字：JSON 的键按字母序输出，
          # id 与 name 在同一个对象里，但不保证相邻。
          tid=$(printf '%s' "$cinfo2" | tr '{' '\n' | grep '"name":"citunnel"' \
            | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
          if [ -z "$tid" ]; then
            echo "::error::cannot resolve the tunnel id from client info"
            printf '%s\n' "$cinfo2"
            exit 1
          fi

          one=$(curl -fsS -H "Authorization: Bearer $apikey" "$BASE/api/user/client/config?tunnel_id=$tid")
          if ! printf '%s' "$one" | grep -q '^name = "citunnel"'; then
            echo "::error::per-tunnel config does not contain the requested tunnel"
            printf '%s\n' "$one"
            exit 1
          fi
          if printf '%s' "$one" | grep -q '^name = "cibatch_'; then
            echo "::error::per-tunnel config leaked another tunnel's proxy"
            printf '%s\n' "$one"
            exit 1
          fi
          pcount=$(printf '%s' "$one" | grep -c '^\[\[proxies\]\]' || true)
          if [ "$pcount" != "1" ]; then
            echo "::error::per-tunnel config has $pcount proxies, want 1"
            printf '%s\n' "$one"
            exit 1
          fi
          # 每份配置都必须自带接入凭据：客户端不会去拼装配置，
          # 少了这一段，那条隧道的进程会直接认证失败。
          if ! printf '%s' "$one" | grep -q "^metadatas = { token = \""; then
            echo "::error::per-tunnel config is missing the access credential"
            printf '%s\n' "$one"
            exit 1
          fi
          echo "PASS per-tunnel config contains exactly one proxy"

          # 他人的隧道 ID 必须按「不存在」处理（404），
          # 不能给出「存在但不属于你」这种可以用来探测 ID 的差别。
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $apikey" "$BASE/api/user/client/config?tunnel_id=999999")
          if [ "$code" != "404" ]; then
            echo "::error::config for a foreign tunnel id returned $code, want 404"
            exit 1
          fi
          # 非法参数是 400，而不是悄悄回退成「下发全部隧道」——
          # 那样客户端会拿到一份包含全部隧道的配置，一条隧道的开关
          # 就会影响所有隧道。
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $apikey" "$BASE/api/user/client/config?tunnel_id=abc")
          if [ "$code" != "400" ]; then
            echo "::error::config with a malformed tunnel id returned $code, want 400"
            exit 1
          fi
          echo "PASS per-tunnel config rejects unknown/malformed tunnel id"

          # ---- frps 插件：首次登录的时序 ----
          #
          # 回归测试，对应一个真实故障：客户端永远停在「等待连接」，
          # frps 反复记录「客户端未完成认证，请重启客户端后重试」，
          # 而重启客户端、放行端口都毫无作用。
          #
          # 根因是时序：frp 在客户端**首次**登录时，插件拿到的 run_id
          # 是空的——frps 要等插件回调通过之后才生成它并回给客户端。
          # 而 onLogin 需要 run_id 才能登记认证会话，于是会话没有写入；
          # 紧接着的 NewProxy 带着 frps 新分配的 run_id 来查，查不到，
          # 就被拒了。
          #
          # 这里按 frp 的真实顺序构造两次回调。凭据与 frp 用户名直接从
          # 下发给客户端的配置里取——那正是 frpc 实际会带上的东西。
          cfg=$(curl -fsS -H "Authorization: Bearer $apikey" "$BASE/api/user/client/config")
          frpuser=$(printf '%s' "$cfg" | sed -n 's/^user = "\([^"]*\)".*/\1/p' | head -1)
          # 键名与 service.MetaTokenKey 一致（"token"）。
          # 必须锚定 metadatas 那一行：配置里还有 auth.token，
          # 只匹配 "token = " 会把 frps 的全局令牌当成每用户凭据取出来，
          # 而那个值校验不过，失败原因会指向完全错误的方向。
          token=$(printf '%s' "$cfg" | sed -n 's/^metadatas = { token = "\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$frpuser" ] || [ -z "$token" ]; then
            echo "::error::cannot extract frp user/token from client config"
            # 打出来便于比对：键名或格式变了要能一眼看出
            printf '%s\n' "$cfg"
            exit 1
          fi

          # 下面两次回调里的 metas 键名必须写成 "token"（= service.MetaTokenKey）。
          # 这里曾经写成 "lt_token"：服务端读的是 metas["token"]，于是取到空串，
          # 凭据比对必然失败，报「客户端凭据无效」——看起来像是时序回归没修好，
          # 实际只是这条断言自己写错了键名。
          #
          # 1) 首次登录：run_id 为空。必须放行。
          login=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"op\":\"Login\",\"content\":{\"version\":\"0.71.0\",\"hostname\":\"ci\",\"os\":\"linux\",\"arch\":\"amd64\",\"user\":\"$frpuser\",\"timestamp\":0,\"privilege_key\":\"\",\"run_id\":\"\",\"metas\":{\"token\":\"$token\"},\"client_address\":\"127.0.0.1:1\"}}" \
            "$BASE/api/frps/plugin")
          if printf '%s' "$login" | grep -q '"reject":true'; then
            echo "::error::Login with empty run_id was rejected: $login"
            exit 1
          fi
          echo "PASS plugin login with empty run_id"

          # 2) 紧接着的 NewProxy 带 frps 新分配的 run_id，并且代理名是
          #    frp 规范化之后的 "<user>.<隧道名>"。
          #
          # 代理名**必须带前缀**：真实 frpc 发来的就是 "lt_u1.mc"，服务端
          # 要先拆掉前缀才能查到库里的 "mc"。这条断言原先用的是裸名
          # "citunnel"，于是「拿原始代理名直接查库」这个缺陷完全测不出来
          # ——测试全绿，真实客户端却一直卡在「连接中」。
          #
          # 载荷按真实形态构造完整（协议与远程端口都取该隧道的实际值），
          # 所以这里可以断言「整个 NewProxy 不能被拒绝」，而不只是
          # 「不能死于认证」：查隧道这一步出任何错都会在响应里带 reject。
          cport=$(printf '%s' "$cinfo2" | tr '{' '\n' | grep '"name":"citunnel"' \
            | sed -n 's/.*"public_addr":"[^"]*:\([0-9]*\)".*/\1/p' | head -1)
          if [ -z "$cport" ]; then
            echo "::error::cannot resolve the public port of citunnel"
            printf '%s\n' "$cinfo2"
            exit 1
          fi
          proxy=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"op\":\"NewProxy\",\"content\":{\"user\":{\"user\":\"$frpuser\",\"metas\":{\"token\":\"$token\"},\"run_id\":\"ci-run-0001\"},\"proxy_name\":\"$frpuser.citunnel\",\"proxy_type\":\"tcp\",\"use_encryption\":false,\"use_compression\":false,\"remote_port\":$cport,\"custom_domains\":[],\"subdomain\":\"\",\"metas\":{}}}" \
            "$BASE/api/frps/plugin")
          if printf '%s' "$proxy" | grep -q '"reject":true'; then
            echo "::error::NewProxy was rejected for a valid prefixed proxy name: $proxy"
            exit 1
          fi
          echo "PASS plugin NewProxy authorized with the prefixed proxy name"

          # 前缀是身份标识，必须与本次回调认定的账号一致：
          # 不允许「用 A 的凭据、在代理名里声称自己是 B」。
          mismatch=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"op\":\"NewProxy\",\"content\":{\"user\":{\"user\":\"$frpuser\",\"metas\":{\"token\":\"$token\"},\"run_id\":\"ci-run-0001\"},\"proxy_name\":\"lt_u999999.citunnel\",\"proxy_type\":\"tcp\",\"remote_port\":$cport}}" \
            "$BASE/api/frps/plugin")
          if ! printf '%s' "$mismatch" | grep -q '与当前账号不匹配'; then
            echo "::error::a proxy name with a foreign user prefix was not rejected: $mismatch"
            exit 1
          fi
          echo "PASS plugin rejects a proxy name with a foreign user prefix"

          # 没有前缀的代理名同样要拒——它不是 frp 规范化的形态，
          # 放行就等于承认「代理名可以不跟 user 走」。
          malformed=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"op\":\"NewProxy\",\"content\":{\"user\":{\"user\":\"$frpuser\",\"metas\":{\"token\":\"$token\"},\"run_id\":\"ci-run-0001\"},\"proxy_name\":\"citunnel\",\"proxy_type\":\"tcp\",\"remote_port\":$cport}}" \
            "$BASE/api/frps/plugin")
          if ! printf '%s' "$malformed" | grep -q '格式非法'; then
            echo "::error::a proxy name without a user prefix was not rejected: $malformed"
            exit 1
          fi
          echo "PASS plugin rejects a proxy name without a user prefix"

          # ---- NewUserConn：用户数据连接放行/拒绝 ----
          #
          # 这条是配额与封禁的实时拦截点，每次新建用户连接都会经过。
          # 它同时也是「解析失败一律拒绝」这条 fail-closed 策略最容易误伤
          # 的地方：一旦 frps 的载荷形状与我们预期不同，所有用户连接都会被
          # 拒，而现象是「隧道在线但连不上」。所以正向必须有一条断言兜住。
          #
          # 载荷用凭据复核路径（run_id 为空、带 metas.token），
          # 与真实回调在「首次登录后 run_id 尚未登记」时的形态一致。
          newconn=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"op\":\"NewUserConn\",\"content\":{\"user\":{\"user\":\"$frpuser\",\"metas\":{\"token\":\"$token\"},\"run_id\":\"\"},\"proxy_name\":\"$frpuser.citunnel\",\"proxy_type\":\"tcp\",\"remote_addr\":\"127.0.0.1:12345\"}}" \
            "$BASE/api/frps/plugin")
          if printf '%s' "$newconn" | grep -q '"reject":true'; then
            echo "::error::NewUserConn was rejected for a valid credential: $newconn"
            exit 1
          fi
          echo "PASS plugin NewUserConn authorized with a valid credential"

          # 反过来：载荷解析不出来时必须拒绝。
          # 放行等于在这个拦截点上跳过配额与封禁判断。
          badconn=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"op":"NewUserConn","content":' \
            "$BASE/api/frps/plugin")
          if ! printf '%s' "$badconn" | grep -q '"reject":true'; then
            echo "::error::NewUserConn with a malformed body was not rejected: $badconn"
            exit 1
          fi
          echo "PASS plugin rejects a malformed NewUserConn body"

          # frps 插件回调：必须能从回环访问
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"version":"0.1.0","op":"Ping","content":{}}' \
            "$BASE/api/frps/plugin")
          if [ "$code" != "200" ]; then
            echo "::error::frps plugin endpoint returned $code"
            exit 1
          fi
          echo "PASS frps plugin endpoint"

          # 管理路由不能在没有令牌的情况下返回业务数据
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/admin/users")
          if [ "$code" != "401" ]; then
            echo "::error::admin API without token returned $code, want 401"
            exit 1
          fi
          echo "PASS admin API requires authentication"

          # 管理后台路径可配置：不带斜杠时应 302 到带斜杠版本
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/smoke-console")
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' "$BASE/smoke-console")
          if [ "$code" != "302" ] || [ "$loc" != "$BASE/smoke-console/" ]; then
            echo "::error::admin path redirect failed (code=$code loc=$loc)"
            exit 1
          fi
          echo "PASS admin path trailing-slash redirect"

          # 自定义路径应返回管理端页面
          body=$(curl -fsS "$BASE/smoke-console/")
          if ! printf '%s' "$body" | grep -q 'ADMIN-CONSOLE'; then
            echo "::error::admin console not served at the configured path"
            exit 1
          fi
          echo "PASS admin console served at the configured path"

          # 默认的 /admin 不再是管理端入口（应落到用户控制台）
          body=$(curl -fsS "$BASE/admin")
          if printf '%s' "$body" | grep -q 'ADMIN-CONSOLE'; then
            echo "::error::/admin still exposes the admin console"
            exit 1
          fi
          echo "PASS /admin no longer exposes the admin console"

          # 暴力破解防护：连续失败后必须被限流/锁定（返回 429）
          locked=0
          for i in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' \
              -d '{"username":"bruteforce","password":"wrong-password"}' \
              "$BASE/api/auth/login")
            if [ "$code" = "429" ]; then locked=1; break; fi
          done
          if [ "$locked" != "1" ]; then
            echo "::error::brute force protection did not trigger within 6 attempts"
            exit 1
          fi
          echo "PASS brute force protection (429 after repeated failures)"

          echo "--- startup log ---"
          cat /tmp/smoke/panel.log

      - name: Upload panel binary
        uses: actions/upload-artifact@v4
        with:
          name: panel-linux-amd64
          path: /tmp/panel
          retention-days: 7

  # ============================================================
  #  前端：用户控制台 + 管理后台
  # ============================================================
  web:
    name: Web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 仓库里提交了 lockfile，npm install 会按它安装（版本因此是锁定的）。
      #
      # 这里不用 npm ci：lockfile 是在 Windows 上生成的，其中 rollup 的原生
      # 可选依赖只包含 win32 条目；npm ci 会严格照 lock 安装，在 Linux runner
      # 上直接报 "Cannot find module @rollup/rollup-linux-x64-gnu"。
      # npm install 会补齐当前平台的可选依赖，同时仍按 lock 里的版本解析。
      #
      # 用户端额外需要 --legacy-peer-deps：npm 10 解析 vitest 4 + jsdom 的
      # peer 图时会报 "Cannot read properties of null (reading 'edgesOut')"。
      - name: Install (user)
        if: matrix.app == 'user'
        working-directory: web/user
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install (admin)
        if: matrix.app == 'admin'
        working-directory: web/admin
        run: npm install --no-audit --no-fund

      - name: Test user UI
        if: matrix.app == 'user'
        working-directory: web/user
        run: npm test

      - name: Build
        working-directory: web/${{ matrix.app }}
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.app }}
          path: web/${{ matrix.app }}/dist
          retention-days: 7

  # ============================================================
  #  Windows 客户端（Wails）
  # ============================================================
  client:
    name: Client (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/windows/go.mod
          # client 模块的 go.sum 尚未入库，先关闭缓存
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Resolve dependencies
        working-directory: client/windows
        run: go mod tidy

      # 只测子包，不测 main：main 依赖 //go:embed frontend/dist，
      # 没构建前端就跑不了。而这里最容易坏掉的是解析逻辑
      # （netstat / tasklist 的输出格式），它全在子包里。
      - name: Unit tests
        working-directory: client/windows
        run: go test ./internal/...

      - name: Build
        working-directory: client/windows
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;$env:USERPROFILE\go\bin"
          # 这里刻意不注入平台地址：CI 只验证能否构建。
          # 公开仓库的 artifact 任何人可下载，把真实地址烧进去等于对外公开。
          # 带地址的正式安装包由 release.yml 产出。
          wails build -clean -platform windows/amd64

      # main 包的测试只能放在构建之后：它依赖 //go:embed frontend/dist，
      # 前端没构建出来就编译不过。本地配置的原子写入与损坏处理都在这个包里，
      # 而这两条路径只在异常情况下才会走到——没有测试就没人守得住。
      - name: Unit tests (main package)
        working-directory: client/windows
        run: go test .

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: LiteTunnel-windows-amd64
          path: client/windows/build/bin/LiteTunnel.exe
          retention-days: 7

  # ============================================================
  #  构建并推送镜像到 GHCR
  #
  #  main 分支每次通过即推送 latest，服务器可直接 pull 部署；
  #  带版本号的镜像由 release.yml 在打 tag 时推送。
  # ============================================================
  publish:
    name: Publish image
    needs: [server, web, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: echo "value=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/litetunnel-panel:latest
            ghcr.io/${{ github.repository_owner }}/litetunnel-panel:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
