# ============================================================
#  LiteTunnel 单机部署编排
#
#  三个服务全部使用 host 网络模式：
#    - frps 需要监听大范围端口池，且要与控制面通过回环地址通信；
#    - panel 的插件回调只允许回环来源，必须与 frps 处于同一网络命名空间；
#    - caddy 需要绑定 80/443。
#
#  对外暴露的端口只有：80、443、网关端口(默认 7000)、KCP 端口(默认 7001/udp)、
#  以及隧道端口池(默认 20000-30000)。管理端口始终只监听回环。
#
#  使用前先执行：deploy/scripts/render.ps1（或 render.sh）生成 frps.toml 与 Caddyfile。
# ============================================================
name: litetunnel

services:
  frps:
    image: fatedier/frps:v0.71.0
    container_name: lt-frps
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/frp/frps.toml"]
    volumes:
      - ./frps/frps.toml:/etc/frp/frps.toml:ro
      - ./data/frps:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 端口池默认 >=1024，如你配置了 <1024 的端口才需要保留此项
      - NET_BIND_SERVICE

  panel:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: litetunnel/panel:latest
    container_name: lt-panel
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      # 覆盖为回环监听：公网流量统一由 Caddy 进入
      LT_USER_ADDR: "127.0.0.1:8080"
      LT_ADMIN_ADDR: "127.0.0.1:8443"
      LT_DB_DRIVER: "sqlite"
      LT_DB_DSN: "/data/litetunnel.db"
      LT_USER_WEB_DIR: "/app/web/user"
      LT_ADMIN_WEB_DIR: "/app/web/admin"
      LT_CLIENT_DIST_DIR: "/data/clients"
      LT_FRPS_API_ADDR: "127.0.0.1:7500"
    volumes:
      - ./data/panel:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - frps

  caddy:
    image: caddy:2-alpine
    container_name: lt-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - panel
