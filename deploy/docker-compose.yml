# ============================================================
#  LiteTunnel 单机部署编排
#
#  三个服务全部使用 host 网络模式：
#    - frps 需要监听大范围端口池，且要与控制面通过回环地址通信；
#    - panel 的插件回调只允许回环来源，必须与 frps 处于同一网络命名空间；
#    - caddy 需要绑定 80/443。
#
#  对外暴露的端口只有：80、443、网关端口(默认 7001)、KCP 端口(默认 7002/udp)、
#  以及隧道端口池(默认 20000-30000)。管理端口始终只监听回环。
#
#  若把 HTTPS 隧道设为端到端模式（LT_HTTPS_TUNNEL_MODE=e2e），还要额外放行
#  LT_VHOST_HTTPS_PORT(默认 8444)：该端口由 frps 直接对公网提供，按 SNI 透传
#  原始 TLS 连接，证书由本地网站持有，Caddy 不参与。
#
#  使用前先执行：deploy/scripts/render.ps1（或 render.sh）生成 frps.toml 与 Caddyfile。
# ============================================================
name: litetunnel

services:
  frps:
    image: fatedier/frps:v0.71.0
    container_name: lt-frps
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/frp/frps.toml"]
    volumes:
      - ./frps/frps.toml:/etc/frp/frps.toml:ro
      - ./data/frps:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # 端口池默认 >=1024，如你配置了 <1024 的端口才需要保留此项
      - NET_BIND_SERVICE

  panel:
    # 镜像由 GitHub Actions 构建并推送到 GHCR（见 .github/workflows/ci.yml 的 publish job）。
    # 这里给出可直接使用的默认值，避免 Compose 插值取不到 .env 时回退到不存在的镜像名。
    # 若要改用国内仓库，在 .env 中设置 LT_PANEL_IMAGE 并以
    #   docker compose --env-file .env -f deploy/docker-compose.yml up -d
    # 方式启动（--env-file 用于让插值读到根目录的 .env）。
    image: ${LT_PANEL_IMAGE:-ghcr.io/xiaoxin-zk/litetunnel-panel:latest}
    # 如需在本机从源码构建，取消下面三行注释后执行：docker compose up -d --build
    # build:
    #   context: ..
    #   dockerfile: server/Dockerfile
    container_name: lt-panel
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      # 覆盖为回环监听：公网流量统一由 Caddy 进入
      # 用户控制台与管理后台共用该端口，通过 /admin 路径区分
      LT_USER_ADDR: "127.0.0.1:7848"
      LT_DB_DRIVER: "sqlite"
      LT_DB_DSN: "/data/litetunnel.db"
      LT_USER_WEB_DIR: "/app/web/user"
      LT_ADMIN_WEB_DIR: "/app/web/admin"
      LT_CLIENT_DIST_DIR: "/data/clients"
      LT_FRPS_API_ADDR: "127.0.0.1:7500"
      # 管理页「磁盘」统计哪块盘。容器里的 / 是镜像自带的 overlay，
      # 容量既不等于宿主机根分区也不等于数据盘；/data 才是挂出来的数据卷
      # （宿主机 ./data/panel 所在分区），数据增长真正影响的就是它。
      LT_MONITOR_DISK_PATH: "/data"
      # 断流兜底队列的落盘镜像。必须显式落在持久卷上：
      # 容器根文件系统是只读的，os.UserCacheDir 指向的位置既不可写也没挂卷，
      # 写失败后「数据库抖一下就丢意图」的兜底等于不存在（见
      # server/internal/service/proxy_drain_fallback.go 的 proxyDrainWALPath）。
      LT_PROXY_DRAIN_WAL: "/data/proxy-drain-outbox.jsonl"
    volumes:
      - ./data/panel:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ===== 防火墙控制 =====
    #
    # 这里**刻意不提供** NET_ADMIN 的开启方式。
    #
    # 面板只做只读的事：扫描 /proc/net/* 看哪些端口在监听（不需要任何特权）。
    # 需要改防火墙时，它把请求发给宿主机上的 lt-fw helper：
    #
    #     systemctl start lt-fw      # 见 deploy/systemd/lt-fw.service
    #
    # 这样即使面板被完全控制，攻击者能做的也只是「放行/关闭端口池内的
    # 端口」，而且仍然受保护端口列表约束，拿不到主机防火墙的完全控制权。
    #
    # 如果给容器 NET_ADMIN，上面这层隔离就没了——面板被攻破等于主机失守。
    depends_on:
      - frps

  caddy:
    # 官方镜像**不含任何 DNS 插件**，只够用在「仅裸域名证书」的部署上。
    # 一旦配置了 LT_TUNNEL_DOMAIN，泛域名证书只能走 DNS Challenge，
    # 而 DNS Challenge 的 dns 指令来自插件，必须换成自行构建的镜像：
    #
    #   1) 在 .env 里填 LT_CADDY_DNS_MODULES=cloudflare（按你的服务商）
    #   2) 取消下面 build 段的注释并构建：
    #        docker compose --env-file .env -f deploy/docker-compose.yml build caddy
    #   3) 把 .env 里的 LT_CADDY_IMAGE 指向构建出的镜像名（如 litetunnel-caddy:latest）
    #
    # 构建文件见 deploy/caddy/Dockerfile。
    image: ${LT_CADDY_IMAGE:-caddy:2-alpine}
    # build:
    #   context: ./caddy
    #   args:
    #     CADDY_VERSION: ${LT_CADDY_VERSION:-2}
    #     CADDY_DNS_MODULES: ${LT_CADDY_DNS_MODULES:-}
    container_name: lt-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      # DNS Challenge 凭据。只经容器环境注入：不落进 Caddyfile、不进日志、
      # 不进版本库。变量名要与 Caddyfile 里 dns 指令的参数一致——默认参数是
      # {env.LT_CADDY_DNS_CREDENTIAL}（见 .env 的 LT_CADDY_DNS_ARGS）。
      #
      # 注意这里是**插值**，所以要跑 compose 时必须带上 --env-file .env
      # （默认只读 deploy/.env）。后台「域名与证书」页保存时会由 lt-config
      # 按同一份 .env 重建容器，那条路径已经显式带上了 --env-file。
      LT_CADDY_DNS_CREDENTIAL: ${LT_CADDY_DNS_CREDENTIAL:-}
    volumes:
      # 注意：必须先跑 deploy/scripts/render（或 render.ps1）。
      # 若 Caddyfile 还不存在，Docker 会把绑定源创建成一个**目录**，
      # 容器随后会以 "is a directory" 拒绝启动，报错信息与真正的原因无关。
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - panel
