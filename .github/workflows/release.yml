name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v1.0.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  packages: write

env:
  # 与 server 侧 frps 镜像保持一致，升级时两处需同步修改
  FRP_VERSION: '0.71.0'

jobs:
  # ============================================================
  #  容器镜像推送到 GitHub Container Registry
  # ============================================================
  docker:
    name: Publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/litetunnel-panel
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  #  Windows 客户端（内置 frpc，开箱即用）
  # ============================================================
  client:
    name: Package Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/windows/go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Resolve dependencies
        working-directory: client/windows
        run: go mod tidy

      - name: Build client
        working-directory: client/windows
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;$env:USERPROFILE\go\bin"
          wails build -clean -platform windows/amd64

      - name: Download frpc
        shell: pwsh
        run: |
          $ver = $env:FRP_VERSION
          $url = "https://github.com/fatedier/frp/releases/download/v$ver/frp_${ver}_windows_amd64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile frp.zip
          Expand-Archive -Path frp.zip -DestinationPath frp -Force
          $exe = Get-ChildItem -Path frp -Recurse -Filter frpc.exe | Select-Object -First 1
          if (-not $exe) { throw 'frpc.exe not found in frp release archive' }
          Copy-Item $exe.FullName -Destination client/windows/build/bin/frpc.exe
          $lic = Get-ChildItem -Path frp -Recurse -Filter LICENSE | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName -Destination client/windows/build/bin/LICENSE-frp.txt }

      - name: Assemble package
        shell: pwsh
        run: |
          $bin = 'client/windows/build/bin'
          @'
LiteTunnel Windows Client
=========================

Quick start
-----------
1. Keep LiteTunnel.exe and frpc.exe in the SAME folder.
2. Run LiteTunnel.exe.
3. Enter your console URL (e.g. https://panel.example.com), username and password.
4. Click "Connect". Tunnels are pulled from the server automatically.

Notes
-----
- This client stores only a revocable access credential, never your password.
- Config and logs live in %AppData%\LiteTunnel
- frpc.exe is bundled from the official frp release (Apache-2.0), see LICENSE-frp.txt
'@ | Set-Content -Path "$bin/README-client.txt" -Encoding UTF8
          Compress-Archive -Path "$bin/*" -DestinationPath LiteTunnel-windows-amd64.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: LiteTunnel-windows-amd64
          path: LiteTunnel-windows-amd64.zip

  # ============================================================
  #  服务端部署包（不含任何真实地址，全部为模板）
  # ============================================================
  deploy-bundle:
    name: Package deploy bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble
        run: |
          mkdir -p bundle/deploy/frps bundle/deploy/caddy bundle/deploy/scripts
          cp deploy/docker-compose.yml bundle/deploy/
          cp deploy/frps/frps.toml.template bundle/deploy/frps/
          cp deploy/caddy/Caddyfile.template bundle/deploy/caddy/
          cp deploy/scripts/render.sh deploy/scripts/render.ps1 bundle/deploy/scripts/
          cp .env.example README.md bundle/
          cd bundle && zip -r ../litetunnel-deploy.zip .

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: litetunnel-deploy
          path: litetunnel-deploy.zip

  # ============================================================
  #  创建 Release 并挂载产物
  # ============================================================
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [client, deploy-bundle]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: LiteTunnel-windows-amd64
          path: assets

      - uses: actions/download-artifact@v4
        with:
          name: litetunnel-deploy
          path: assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: LiteTunnel ${{ steps.ver.outputs.version }}
          draft: true
          generate_release_notes: true
          body: |
            ## 产物说明

            | 文件 | 用途 |
            |---|---|
            | `LiteTunnel-windows-amd64.zip` | Windows 客户端，已内置 frpc.exe，解压即用 |
            | `litetunnel-deploy.zip` | 服务端部署包（compose / frps 模板 / Caddy 模板 / .env 模板） |

            容器镜像：`ghcr.io/${{ github.repository_owner }}/litetunnel-panel:${{ steps.ver.outputs.version }}`

            ## 服务端部署

            ```bash
            docker login ghcr.io -u <你的用户名> -p <带 read:packages 权限的 PAT>
            unzip litetunnel-deploy.zip && cd bundle
            cp .env.example .env && vi .env          # 填写域名与各项密钥
            bash deploy/scripts/render.sh            # 渲染 frps.toml 与 Caddyfile
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d
            ```
          files: |
            assets/LiteTunnel-windows-amd64.zip
            assets/litetunnel-deploy.zip
